server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: any unmatched path falls back to index.html so
  # React Router can handle client-side routing.
  location / {
    try_files $uri /index.html;
  }

  # In the Docker Compose network, the frontend container proxies API calls
  # to the api-gateway container by service name - the browser only ever
  # talks to this nginx server, never directly to the gateway or a
  # microservice, keeping CORS simple and matching "frontend talks to the
  # gateway only".
  location /api/v1/ {
    proxy_pass http://api-gateway:4000/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
