name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs the Jest test suite (with coverage) for each of the four backend
  # Node.js services independently - matches "each microservice is
  # independently testable and deployable".
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - services/academic-service
          - services/finance-service
          - services/hr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install
      - name: Run tests with coverage
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage
          if-no-files-found: ignore

  # Builds the React frontend to catch compile-time errors (JSX, imports,
  # bundling) before it ever reaches a Docker build.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build

  # Builds every service's Docker image to prove the Dockerfiles are valid
  # and the whole system is deployable via `docker compose up --build`.
  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build

  report:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, build-docker-images]
    if: always()
    steps:
      - name: Pipeline summary
        run: |
          echo "Backend tests: ${{ needs.test-backend.result }}"
          echo "Frontend build: ${{ needs.build-frontend.result }}"
          echo "Docker image build: ${{ needs.build-docker-images.result }}"
          if [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.build-frontend.result }}" != "success" ] || \
             [ "${{ needs.build-docker-images.result }}" != "success" ]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED"
